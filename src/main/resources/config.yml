# All text supports MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html
storage:
  file: friends.yml
requests:
  expiry-seconds: 60
  notify-friends-on-join: true
messages:
  prefix: '<gradient:#6d5dfc:#a78bfa><bold>Friends</bold></gradient> <dark_gray>»</dark_gray> '
  no-permission: '<red>You do not have permission.</red>'
  player-only: '<red>This command is for players only.</red>'
  player-not-found: '<red>That player has never joined this server.</red>'
  cannot-friend-self: '<red>You cannot add yourself.</red>'
  already-friends: '<yellow>You are already friends with <white><target></white>.</yellow>'
  request-sent: '<green>Friend request sent to <white><target></white>.</green>'
  request-received: '<aqua><sender></aqua> <white>wants to be your friend. Use <green>/<accept-command></green> or <red>/<deny-command></red> within <yellow><seconds>s</yellow>.</white>'
  request-expired: '<red>Your friend request from <white><sender></white> has expired.</red>'
  no-request: '<red>You have no pending friend request.</red>'
  request-accepted: '<green>You are now friends with <white><target></white>!</green>'
  request-accepted-sender: '<green><target> accepted your friend request!</green>'
  request-denied: '<yellow>You declined the friend request from <white><sender></white>.</yellow>'
  request-denied-sender: '<red><target> declined your friend request.</red>'
  friend-removed: '<yellow>You removed <white><target></white> from your friends.</yellow>'
  removed-by-other: '<yellow><target> removed you from their friends.</yellow>'
  friend-joined: '<green>Your friend <white><target></white> is now online.</green>'
  reloaded: '<green>BanditFriends configuration reloaded.</green>'
  admin-added: '<green>Added <white><target></white> as friend of <white><player></white>.</green>'
  admin-removed: '<yellow>Removed <white><target></white> from <white><player></white>.</yellow>'
  admin-list: '<aqua><player>''s friends <gray>(<amount>)</gray>: <white><friends></white>'
